<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beschwerde Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0e0e0f;--surface:#161618;--card:#1e1e21;--border:#2a2a2e;
  --accent:#c9a84c;--accent2:#7b6cd4;--correct:#4caf7d;--wrong:#e05252;
  --text:#e8e6df;--muted:#7a7870;--tag:#252528;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
header{border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:100;}
header h1{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--accent);}
.header-sub{font-size:0.68rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;}
#stats-bar{display:flex;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:.75rem;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.stat-val{color:var(--accent);font-size:1rem;font-weight:500;}
.stat-lbl{color:var(--muted);font-size:.62rem;letter-spacing:.1em;}
main{display:flex;flex:1;}
#sidebar{width:252px;min-width:252px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;}
.sidebar-group{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;padding:10px 18px 4px;}
.sidebar-btn{display:flex;align-items:center;width:100%;padding:8px 18px;background:none;border:none;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:.76rem;cursor:pointer;text-align:left;gap:8px;transition:background .15s;opacity:.82;}
.sidebar-btn:hover{background:var(--card);opacity:1;}
.sidebar-btn.active{background:var(--card);border-left:2px solid var(--accent);color:var(--accent);opacity:1;}
.sidebar-btn .num{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--muted);min-width:20px;}
.sidebar-btn.active .num{color:var(--accent);}
#content{flex:1;padding:28px 36px;overflow-y:auto;}
#mode-bar{display:flex;gap:7px;margin-bottom:24px;flex-wrap:wrap;}
.mode-btn{padding:6px 14px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.05em;cursor:pointer;transition:all .15s;border-radius:2px;}
.mode-btn:hover{border-color:var(--accent);color:var(--text);}
.mode-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500;}
.section-header{margin-bottom:20px;}
.section-pattern{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--accent);background:var(--tag);display:inline-block;padding:3px 10px;border-radius:2px;margin-bottom:4px;}
.section-title{font-family:'Playfair Display',serif;font-size:1.35rem;margin-bottom:4px;}
.section-desc{color:var(--muted);font-size:.78rem;}
.prog-bar-wrap{background:var(--border);border-radius:1px;height:3px;margin-bottom:16px;}
.prog-bar{background:var(--accent);height:3px;border-radius:1px;transition:width .3s;}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.toggle-label{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;}
.toggle{width:34px;height:17px;background:var(--border);border-radius:9px;cursor:pointer;position:relative;transition:background .2s;border:none;}
.toggle::after{content:'';position:absolute;width:11px;height:11px;background:var(--muted);border-radius:50%;top:3px;left:3px;transition:all .2s;}
.toggle.on{background:var(--accent);}
.toggle.on::after{left:20px;background:var(--bg);}
/* LIST */
.sentence-list{display:flex;flex-direction:column;gap:2px;}
.sentence-row{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:12px 16px;display:grid;grid-template-columns:26px 1fr 1fr;gap:10px;align-items:start;transition:background .15s;}
.sentence-row:hover{background:#212124;}
.row-num{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted);padding-top:3px;}
.row-de{font-size:1rem;line-height:1.65;}
.row-tr{font-size:.92rem;color:var(--muted);line-height:1.65;}
.hl{color:var(--accent);font-weight:500;}
/* CARDS */
.flashcard{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:40px 36px;cursor:pointer;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;user-select:none;position:relative;transition:border-color .2s;margin-bottom:16px;}
.flashcard:hover{border-color:var(--accent);}
.flashcard.flipped{border-color:var(--accent2);}
.card-front{font-size:1.45rem;line-height:1.75;color:var(--text);}
.card-back{display:none;margin-top:22px;padding-top:22px;border-top:1px solid var(--border);width:100%;}
.flashcard.flipped .card-back{display:block;}
.card-back-de{font-size:1.25rem;color:var(--accent);font-family:'IBM Plex Mono',monospace;margin-bottom:6px;line-height:1.6;}
.flip-hint{position:absolute;bottom:10px;right:14px;font-size:.68rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.card-nav{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px;}
.nav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 18px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.72rem;transition:all .15s;border-radius:2px;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.card-progress{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--muted);min-width:66px;text-align:center;}
/* BLANK */
.exercise-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;margin-bottom:14px;}
.ex-label{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.ex-sentence{font-size:1.1rem;line-height:2.1;margin-bottom:12px;}
.blank-input{background:var(--bg);border:1px solid var(--border);border-bottom:2px solid var(--accent2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:1rem;padding:4px 8px;outline:none;min-width:130px;transition:border-color .2s;border-radius:2px 2px 0 0;}
.blank-input:focus{border-bottom-color:var(--accent);}
.blank-input.correct{border-bottom-color:var(--correct);background:#1a2e22;}
.blank-input.wrong{border-bottom-color:var(--wrong);background:#2e1a1a;}
.ex-hint{font-size:.88rem;color:var(--muted);margin-bottom:12px;}
.ex-hint span{color:var(--accent);font-family:'IBM Plex Mono',monospace;}
.ex-controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.check-btn{background:var(--accent);color:var(--bg);border:none;padding:8px 20px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.07em;cursor:pointer;border-radius:2px;font-weight:500;}
.check-btn:hover{opacity:.85;}
.show-answer-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:7px 14px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;cursor:pointer;border-radius:2px;transition:all .15s;}
.show-answer-btn:hover{border-color:var(--muted);color:var(--text);}
.feedback{margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:.78rem;padding:7px 11px;border-radius:2px;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:#1a2e22;color:var(--correct);border-left:3px solid var(--correct);}
.feedback.err{background:#2e1a1a;color:var(--wrong);border-left:3px solid var(--wrong);}
.full-answer{display:none;background:var(--bg);border-left:3px solid var(--correct);padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--correct);margin-top:8px;border-radius:0 2px 2px 0;}
/* TRANSLATE */
.translate-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:26px;margin-bottom:14px;}
.tr-prompt{font-size:.72rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
.tr-sentence{font-size:1.25rem;color:var(--accent);margin-bottom:16px;line-height:1.7;}
.tr-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:1rem;padding:10px 13px;outline:none;resize:vertical;min-height:70px;border-radius:2px;transition:border-color .2s;margin-bottom:10px;}
.tr-input:focus{border-color:var(--accent2);}
.tr-answer{display:none;background:var(--bg);border-left:3px solid var(--correct);padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--correct);margin-top:8px;border-radius:0 2px 2px 0;}
.tr-answer.show{display:block;}
/* QUIZ */
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:26px;margin-bottom:14px;}
.quiz-q{font-size:1.15rem;line-height:1.7;margin-bottom:18px;}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.quiz-opt{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px 15px;text-align:left;font-family:'IBM Plex Sans',sans-serif;font-size:.95rem;cursor:pointer;border-radius:2px;transition:all .15s;line-height:1.45;}
.quiz-opt:hover:not(:disabled){border-color:var(--accent2);}
.quiz-opt.correct-opt{background:#1a2e22;border-color:var(--correct);color:var(--correct);}
.quiz-opt.wrong-opt{background:#2e1a1a;border-color:var(--wrong);color:var(--wrong);}
.quiz-opt:disabled{cursor:default;}
.quiz-next{margin-top:14px;display:none;}
.quiz-next.show{display:block;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media(max-width:700px){#sidebar{display:none;}#content{padding:16px 14px;}.quiz-options{grid-template-columns:1fr;}.sentence-row{grid-template-columns:22px 1fr;}.row-tr{grid-column:2;}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Beschwerde Trainer</h1>
    <div class="header-sub">SCHREIBEN · B2–C1 · DEUTSCH–TÜRKÇE</div>
  </div>
  <div id="stats-bar">
    <div class="stat"><span class="stat-val" id="s-correct">0</span><span class="stat-lbl">DOĞRU</span></div>
    <div class="stat"><span class="stat-val" id="s-wrong">0</span><span class="stat-lbl">YANLIŞ</span></div>
    <div class="stat"><span class="stat-val" id="s-total">0</span><span class="stat-lbl">TOPLAM</span></div>
  </div>
</header>
<main>
  <nav id="sidebar"></nav>
  <section id="content">
    <div id="mode-bar">
      <button class="mode-btn active" onclick="setMode('list',this)">📋 Liste</button>

      <button class="mode-btn" onclick="setMode('blank',this)">✏️ Boşluk Doldur</button>

      <button class="mode-btn" onclick="setMode('quiz',this)">🎯 Quiz</button>
    </div>
    <div id="exercise-area"></div>
  </section>
</main>

["Hinzu kommt, dass mir durch die Verzögerung zusätzliche Kosten entstanden sind, die ich nicht zu verantworten habe.","Buna ek olarak, gecikme yüzünden benim sorumlu olmadığım ek masraflar çıktı."],
["Ich gehe davon aus, dass Sie meine Beschwerde sorgfältig prüfen und mir zeitnah eine faire Lösung anbieten.","Şikâyetimi dikkatlice inceleyeceğinizi ve bana kısa sürede adil bir çözüm sunacağınızı varsayıyorum."],

let curSec=0,curMode='list',cardIdx=0,cardFlipped=false,shuffleOn=false;
let quizIdx=0,trIdx=0,blkIdx=0;
let score={c:0,w:0,t:0};
let order=[];

function getSents(){
  const s=sections[curSec].sentences;
  return shuffleOn?order.map(i=>s[i]):[...s];
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function resetOrder(){order=sections[curSec].sentences.map((_,i)=>i);if(shuffleOn)order=shuffle(order);}

function buildSidebar(){
  const nav=document.getElementById('sidebar');
  nav.innerHTML='<div class="sidebar-group">KALIP LİSTESİ</div>';
  sections.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='sidebar-btn'+(i===curSec?' active':'');
    b.innerHTML=`<span class="num">${s.id}</span>${s.title.length>36?s.title.slice(0,34)+'…':s.title}`;
    b.onclick=()=>{curSec=i;resetOrder();cardIdx=0;quizIdx=0;trIdx=0;blkIdx=0;cardFlipped=false;buildSidebar();render();};
    nav.appendChild(b);
  });
}

function setMode(m,btn){
  curMode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  cardIdx=0;cardFlipped=false;quizIdx=0;trIdx=0;blkIdx=0;
  resetOrder();render();
}

function render(){
  const area=document.getElementById('exercise-area');
  const sec=sections[curSec];
  const sents=getSents();
  let h=`<div class="section-header">
    <div class="section-pattern">${sec.pattern}</div>
    <h2 class="section-title">${sec.title}</h2>
    <div class="section-desc">${sec.desc} — <strong>${sents.length}</strong> cümle</div>
  </div>
  <div class="prog-bar-wrap"><div class="prog-bar" style="width:${(curSec+1)/sections.length*100}%"></div></div>
  <div class="toggle-row">
    <button class="toggle${shuffleOn?' on':''}" onclick="toggleShuffle()"></button>
    <span class="toggle-label">KARIŞTIR</span>
  </div>`;
  if(curMode==='list') h+=renderList(sents);
  else if(curMode==='cards') h+=renderCards(sents);
  else if(curMode==='blank') h+=renderBlank(sents);
  else if(curMode==='translate') h+=renderTranslate(sents);
  else if(curMode==='quiz') h+=renderQuiz(sents);
  area.innerHTML=h;
  attachKeys();
}

function toggleShuffle(){shuffleOn=!shuffleOn;resetOrder();cardIdx=0;quizIdx=0;trIdx=0;blkIdx=0;render();}

function renderList(sents){
  let h='<div class="sentence-list">';
  sents.forEach((s,i)=>{
    const de=s[0].replace(/(Ich möchte|Das Problem|Ich bitte|Ich wende|Hiermit|Ich schreibe|Leider|Obwohl|Außerdem|Hinzu kommt|Besonders ärgerlich|Trotz|Dadurch|Ich halte|Ich fordere|Ich erwarte|Sollte|Falls|Ich hoffe|Ich gehe|Sowohl|Weder|Nicht nur|deshalb|daher|dennoch|trotzdem|Vielen Dank|Für Rückfragen|Ich bin|Es ist|Ich sehe|Ich weise|Ich behalte)/g,'<span class="hl">$1</span>');
    h+=`<div class="sentence-row"><span class="row-num">${i+1}</span><span class="row-de">${de}</span><span class="row-tr">${s[1]}</span></div>`;
  });
  return h+'</div>';
}

function renderCards(sents){
  const s=sents[cardIdx];
  return `<div class="flashcard${cardFlipped?' flipped':''}" id="fc" onclick="flipCard()">
    <div class="card-front">${s[1]}</div>
    <div class="card-back"><div class="card-back-de">${s[0]}</div></div>
    <span class="flip-hint">${cardFlipped?'ALMANCA ✓':'TIKLA → ALMANCASINI GÖR'}</span>
  </div>
  <div class="card-nav">
    <button class="nav-btn" onclick="prevCard()">← GERİ</button>
    <span class="card-progress">${cardIdx+1} / ${sents.length}</span>
    <button class="nav-btn" onclick="nextCard()">İLERİ →</button>
  </div>`;
}
function flipCard(){cardFlipped=!cardFlipped;render();}
function nextCard(){const s=getSents();cardIdx=(cardIdx+1)%s.length;cardFlipped=false;render();}
function prevCard(){const s=getSents();cardIdx=(cardIdx-1+s.length)%s.length;cardFlipped=false;render();}

function renderBlank(sents){
  const s=sents[blkIdx];
  const words=s[0].split(' ');
  const keys=words.filter(w=>w.replace(/[.,!?]/g,'').length>5);
  const toBlank=keys.slice(0,Math.min(3,Math.ceil(keys.length/2)));
  let displayed=s[0];
  toBlank.forEach((w,i)=>{
    const clean=w.replace(/[.,!?]$/,'');
    if(displayed.includes(clean)&&clean.length>4){
      displayed=displayed.replace(clean,`<input class="blank-input" id="bl${i}" data-answer="${clean}" placeholder="___" size="${Math.max(10,clean.length)}">`);
    }
  });
  return `<div class="exercise-card">
    <div class="ex-label">BOŞLUK DOLDUR — ${blkIdx+1} / ${sents.length}</div>
    <div class="ex-sentence">${displayed}</div>
    <div class="ex-hint">Türkçe: <span>${s[1]}</span></div>
    <div class="ex-controls">
      <button class="check-btn" onclick="checkBlanks()">KONTROL ET</button>
      <button class="show-answer-btn" onclick="showBlankAns()">CEVABI GÖR</button>
    </div>
    <div class="feedback" id="blfb"></div>
    <div class="full-answer" id="blans">✓ ${s[0]}</div>
  </div>
  <div class="card-nav">
    <button class="nav-btn" onclick="prevBlk()">← GERİ</button>
    <span class="card-progress">${blkIdx+1} / ${sents.length}</span>
    <button class="nav-btn" onclick="nextBlk()">İLERİ →</button>
  </div>`;
}
function checkBlanks(){
  let all=true,cor=0,tot=0;
  document.querySelectorAll('.blank-input').forEach(inp=>{
    tot++;
    const ans=inp.dataset.answer.toLowerCase().replace(/[.,!?]$/,'').trim();
    const val=inp.value.toLowerCase().replace(/[.,!?]$/,'').trim();
    if(val===ans){inp.classList.add('correct');inp.classList.remove('wrong');cor++;}
    else{inp.classList.add('wrong');inp.classList.remove('correct');all=false;}
  });
  const fb=document.getElementById('blfb');
  fb.className='feedback show '+(all?'ok':'err');
  fb.textContent=all?'✓ Tüm boşluklar doğru!':'✗ '+cor+'/'+tot+' doğru. Tekrar dene.';
  if(all)score.c++;else score.w++;score.t++;updateStats();
}
function showBlankAns(){
  document.getElementById('blans').style.display='block';
  document.querySelectorAll('.blank-input').forEach(inp=>{inp.value=inp.dataset.answer;inp.classList.add('correct');});
}
function nextBlk(){const s=getSents();blkIdx=(blkIdx+1)%s.length;render();}
function prevBlk(){const s=getSents();blkIdx=(blkIdx-1+s.length)%s.length;render();}

function renderTranslate(sents){
  const s=sents[trIdx];
  return `<div class="translate-card">
    <div class="tr-prompt">TÜRKÇE → ALMANCAYA ÇEVİR</div>
    <div class="tr-sentence">${s[1]}</div>
    <textarea class="tr-input" id="tri" placeholder="Almanca cümlenizi yazın…" rows="3"></textarea>
    <div class="ex-controls"><button class="check-btn" onclick="showTrAns()">CEVABI GÖR</button></div>
    <div class="tr-answer" id="tra">✓ ${s[0]}</div>
  </div>
  <div class="card-nav">
    <button class="nav-btn" onclick="prevTr()">← GERİ</button>
    <span class="card-progress">${trIdx+1} / ${sents.length}</span>
    <button class="nav-btn" onclick="nextTr()">İLERİ →</button>
  </div>`;
}
function showTrAns(){document.getElementById('tra').classList.add('show');}
function nextTr(){const s=getSents();trIdx=(trIdx+1)%s.length;render();}
function prevTr(){const s=getSents();trIdx=(trIdx-1+s.length)%s.length;render();}

function renderQuiz(sents){
  const s=sents[quizIdx];
  const cor=s[0];
  const others=sents.filter((_,i)=>i!==quizIdx).map(x=>x[0]);
  const opts=shuffle([cor,...shuffle(others).slice(0,3)]);
  const esc=str=>str.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  let btns=opts.map((o,i)=>`<button class="quiz-opt" id="qo${i}" onclick="ansQuiz(${i},'${esc(o)}','${esc(cor)}')">${o}</button>`).join('');
  return `<div class="quiz-card">
    <div class="ex-label">QUİZ — ${quizIdx+1} / ${sents.length}</div>
    <div class="quiz-q">🇹🇷 ${s[1]}</div>
    <div class="quiz-options">${btns}</div>
    <div class="quiz-next" id="qnext"><button class="nav-btn" onclick="nextQuiz()">SONRAKI →</button></div>
  </div>`;
}
function ansQuiz(idx,chosen,correct){
  document.querySelectorAll('.quiz-opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct)b.classList.add('correct-opt');
  });
  const btn=document.getElementById('qo'+idx);
  if(chosen===correct){score.c++;}else{btn.classList.add('wrong-opt');score.w++;}
  score.t++;updateStats();
  document.getElementById('qnext').classList.add('show');
}
function nextQuiz(){const s=getSents();quizIdx=(quizIdx+1)%s.length;render();}

function updateStats(){
  document.getElementById('s-correct').textContent=score.c;
  document.getElementById('s-wrong').textContent=score.w;
  document.getElementById('s-total').textContent=score.t;
}
function attachKeys(){
  document.onkeydown=e=>{
    if(curMode==='cards'){
      if(e.key==='ArrowRight')nextCard();
      if(e.key==='ArrowLeft')prevCard();
      if(e.key===' '){e.preventDefault();flipCard();}
    }
  };
}

resetOrder();buildSidebar();render();
</script>
</body>
</html>
